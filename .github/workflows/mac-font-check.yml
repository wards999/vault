# One-off check, run by hand from the Actions tab (or `gh workflow run mac-font-check.yml`):
# which UI font Vault should name on macOS (memory, and whether Qt scans every font).
# About 3 Mac minutes (counted x10 against the free monthly allowance).
name: Mac font check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --quiet -r requirements-lock.txt psutil
      - name: Check fonts
        run: python tools/mac_font_check.py
