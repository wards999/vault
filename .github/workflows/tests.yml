# Runs Vault's tests (tests/run_all.py) on every push to main, and before every build (build.yml calls this).
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --quiet -r requirements.txt -r tests/requirements.txt
      - name: Install KeePassXC (some tests check files the way KeePassXC sees them)
        run: choco install keepassxc --no-progress -y
      - name: Use a full-size screen (the default 1024x768 is smaller than Vault's windows)
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run the tests
        run: python tests/run_all.py
