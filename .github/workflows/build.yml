# Builds Vault for Windows and macOS on every push to main (and on demand from the Actions tab);
# download the results from the run's "Artifacts" section.
#
# Releases: pushing a tag like v1.2.0 (which must match VERSION in vault.py) also publishes a
# GitHub Release with both zips attached:   git tag v1.2.0   then   git push origin v1.2.0
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # lets the release job publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: Vault-windows
          path: dist/Vault-portable.zip

  macos:
    runs-on: macos-14  # Apple Silicon (M1 and later)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Vault-mac
          path: dist/Vault-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' vault.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION = \"$version\" in vault.py"
            exit 1
          fi
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/Vault-windows/Vault-portable.zip "Vault-${GITHUB_REF_NAME}-windows.zip"
          mv artifacts/Vault-mac/Vault-mac.zip "Vault-${GITHUB_REF_NAME}-mac.zip"
          gh release create "$GITHUB_REF_NAME" Vault-*.zip \
            --title "Vault ${GITHUB_REF_NAME}" --generate-notes
